# What the package of Godot is held to, which is a run of the suite the script below holds.
#
# It is a workflow of its own rather than a job of the one which holds the package of Unity, because the two packages
# are held to different things: a suite of an editor cannot be run by a runner which holds no editor, and this one is a
# suite of an engine which a runner can simply be given. What the two share is the shape - a check out, the SDK which
# the tree is built with, and the suite - and beyond that nothing.
name: Godot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run of a branch which was pushed to again is answered by the one which is on its way and says nothing a reader
# needs, so it is dropped rather than queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is written: what this reads is the tree and the engine it downloads, and what it answers with is a run.
permissions:
  contents: read

jobs:
  godot:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up the SDK which the tree is built with
        uses: actions/setup-dotnet@v5
        with:
          # The SDK the generator and the weaver are built with and the suite is built with, which is the one the
          # workflow of the other package asks for: a tree whose two halves are built by two compilers is a tree which
          # two readers of one commit read differently.
          dotnet-version: 10.0.x

      - name: Download the engine which the suite is run with
        # The engine is not installed on the runner, so it is fetched here and named for the script which runs it. The
        # name is the tag of the release, and the file is the one that tag publishes: taken together, a run here is a
        # run of a known engine rather than of whichever one a runner happens to carry.
        shell: pwsh
        env:
          GODOT_VERSION: 4.7-stable
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'godot'
          $asset = "Godot_v$($env:GODOT_VERSION)_mono_win64.zip"
          $url = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/$asset"

          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $directory

          # The archive holds the editor twice: once as the program which shows a window, and once as one which writes
          # to the console it was started from. The first is the one to run, because the second looks for the first
          # beside it under the name the archive gave it, and the suite redirects what it printed to a file anyway.
          $engine = Get-ChildItem $directory -Recurse -Filter 'Godot_v*_mono_win64.exe' |
                    Where-Object { $_.Name -notlike '*console*' } |
                    Select-Object -First 1

          if (-not $engine) { throw "the engine was not among the files of $asset" }

          Write-Host "the engine is $($engine.FullName)"
          "GODOT=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        # What is run is the script which the commands live in rather than the commands themselves: what each run is
        # for is written out where the commands are, once.
        shell: bash
        run: bash .github/scripts/test-godot.sh
