# What the workflow of a release runs before it publishes is run here on every push to the branch the releases are cut
# from and on every pull request: a suite which is first run when a version is being published is a suite which reports
# a fault of a commit made weeks ago, at the one moment where stopping is most expensive and where nobody is looking for
# it.
#
# The runner is the one the workflow of a release runs on, and for the same reason: the plugin which the package of
# Unity ships is a binary which is committed, and it is built again by that workflow, so a run here and a run there are
# a run of the same platform rather than of two. Nothing below asks for the platform - the generator is built for
# netstandard2.0 and the script is Python - and the two are held to one of them rather than left to differ where a
# release would be the first to find out.
#
# The commands below are the ones that workflow holds, word for word, so that a run of this one and a run of that one
# answer the same way. They are taken from the script which that workflow runs as well rather than named here a second
# time; the reason each of them is there is written out where the commands are.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  # A branch which is not a pull request yet, and a run which is asked for again after something beside the tree changed.
  workflow_dispatch:

# A run of a branch which was pushed to again is answered by the one which is on its way and says nothing a reader
# needs, so it is dropped rather than queued behind it. The group is the branch rather than the commit, because what
# makes the earlier run unnecessary is the later commit of the same branch and not a commit of another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is written: what this reads is the tree and the packages it is built from, and what it answers with is a run.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # Every commit of the history, because the suite reads the commit which the plugin was built at out of the
          # plugin and asks the history about it: a clone of one commit holds the commit which stands at the tip of it
          # and none of the ones behind, so a record which names any other commit is a name which no such clone holds,
          # and the gate refuses a record it cannot read the way it refuses one which is out of date.
          fetch-depth: 0

      - name: Set up the SDK which the tree is built with
        uses: actions/setup-dotnet@v5
        with:
          # The SDK which the generator is built with, which is the one its language belongs to, and the one
          # `global.json` holds the tree to: a project which a machine builds with whichever SDK happens to be newest
          # there is a project which is built against two compilers by two readers of one commit.
          dotnet-version: 10.0.x

      - name: Test the script which writes the version into the files
        # The version is written into every file which names one, and the readme is read by whoever is deciding what to
        # install, so a readme which was left at the version of the release before this one is a reader who is sent to a
        # package of that version. What keeps the two together is the script beside it, which is tested here as well as
        # before a release runs it: a placeholder which stopped matching the readme it was written for is a commit which
        # breaks the next release rather than the one it is in.
        shell: bash
        run: python .github/scripts/set-version-tests.py

      - name: Test
        # The suite is the one a release runs, taken from the script which that workflow runs as well rather than named
        # here a second time: what each run is for is written out where the commands are.
        shell: bash
        run: bash .github/scripts/test.sh